```yaml
name: ALASHI Signing Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Test signing key
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$PRIVATE_KEY" || { echo "Private key secret missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Password secret missing"; exit 1; }

          printf '%s' "$PRIVATE_KEY" | base64 --decode > signing.key
          printf 'ALASHI signing test\n' > test.txt

          minisign -Sm test.txt -s signing.key -W -P "$KEY_PASSWORD"

          echo "Signing succeeded."
          rm -f signing.key
```