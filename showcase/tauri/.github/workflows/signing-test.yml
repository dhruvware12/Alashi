name: ALASHI Signing Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Test signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_KEY: ${{ fromJson('{"key":"value"}').key }}
        run: |
          set -e
          test -n "$PRIVATE_KEY" || { echo "Private key secret missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Password secret missing"; exit 1; }

          echo "$PRIVATE_KEY" | base64 -d > signing.key
          echo "ALASHI signing test" > test.txt

          minisign -Sm test.txt -s signing.key -P "$KEY_PASSWORD"

          echo "Signing succeeded."