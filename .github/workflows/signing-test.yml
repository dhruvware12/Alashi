name: ALASHI Signing Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check private key fingerprint
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$PRIVATE_KEY" | base64 --decode > signing.key
          sha256sum signing.key
          rm -f signing.key